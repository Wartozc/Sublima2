<span class="material-symbols-outlined back" (click)="goToBack()">arrow_back</span>
<div class="container">
    <h1>Registro de usuario</h1>
    <form action="submit" [formGroup]="formGroupUser">
        <section class="input--group">
            <label for="document-type">Tipo documento</label>
            <input type="text" name="document-type" formControlName="documentType">
        </section>
        <section class="input--group">
            <label for="document-number">Número documento</label>
            <input type="text" name="document-number" formControlName="documentNumber">
        </section>
        <section class="input--group">
            <label for="name">Nombre completo</label>
            <input type="text" name="name" formControlName="userName">
        </section>
        <section class="input--group">
            <label for="email">Correo electrónico</label>
            <input type="text" name="email" formControlName="userEmail">
        </section>
        <section class="input--group">
            <label for="phone">Teléfono contacto</label>
            <input type="text" name="phone" formControlName="phone">
        </section>
        <section class="input--group">
            <label for="address">Dirección</label>
            <input type="text" name="address" formControlName="address">
        </section>
        <div class="city--country">
            <section class="input--group">
                <label for="city">Ciudad</label>
                <input type="text" name="city" formControlName="city">
            </section>
            <section class="input--group">
                <label for="country">País</label>
                <input type="text" name="country" formControlName="country">
            </section>
        </div>
        <section class="input--group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" formControlName="userPassword">
        </section>
        <section class="input--group">
            <label for="password2">Confirmar contraseña</label>
            <input type="password" name="password2" formControlName="userPassword2">
        </section>
    </form>
    <button (click)="saveUser()"><span class="material-symbols-outlined">person_add</span> Registrar</button>
</div>
