<div class="container">
    <h1>Iniciar Sesión</h1>
    <form action="">
        <section class="input--group">
            <label for="document-type">Tipo documento</label>
            <input type="text" name="document-type">
        </section>
        <section class="input--group">
            <label for="document-number">Número documento</label>
            <input type="text" name="document-number">
        </section>
        <section class="input--group">
            <label for="name">Nombre completo</label>
            <input type="text" name="name">
        </section>
        <section class="input--group">
            <label for="email">Correo electrónico</label>
            <input type="text" name="email">
        </section>
        <section class="input--group">
            <label for="phone">Teléfono contacto</label>
            <input type="text" name="phone">
        </section>
        <section class="input--group">
            <label for="address">Dirección</label>
            <input type="text" name="address">
        </section>
        <div class="city--country">
            <section class="input--group">
                <label for="city">Ciudad</label>
                <input type="text" name="city">
            </section>
            <section class="input--group">
                <label for="country">País</label>
                <input type="text" name="country">
            </section>
        </div>
        <section class="input--group">
            <label for="password">Contraseña</label>
            <input type="password" name="password">
        </section>
        <section class="input--group">
            <label for="password2">Confirmar contraseña</label>
            <input type="password" name="password2">
        </section>
    </form>
    <button><span class="material-symbols-outlined">person_add</span> Registrar</button>
</div>
